[tox]
isolated_build = true
envlist = py{39,310,311},lint,check-dist

[flake8]
max-line-length = 120

[testenv]
deps = uv cocotb-test pytest pytest-xdist cocotb>=2.0.0
commands =
    uv sync --active
    uv run pytest tests -n auto

[testenv:lint]
deps = uv
commands =
    uv sync --active --only-group lint
    uv run --active flake8 cocotbext/ tests/

[testenv:check-dist]
skip_install = true
deps =
    uv
    twine
commands =
    uv build
    twine check dist/*

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311